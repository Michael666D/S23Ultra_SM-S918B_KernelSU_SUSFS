name: Set up KernelSU-Next
description: download and set up KSUN into the kernel source

inputs:
  susfs:
    description: "susfs"
    required: true

runs:
  using: composite
  steps:
    - name: Setup KSUN with no susfs
      if: inputs.susfs == 'false'
      shell: bash
      run: |
        cd "$COMMON"
        curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -s dev

        cd KernelSU-Next/kernel
        COMMITS_COUNT=$(/usr/bin/git rev-list --count HEAD)
        BASE_VERSION=30000
        KSU_VERSION=$(expr $COMMITS_COUNT + "$BASE_VERSION")
        sed -i "s/^KSU_VERSION_FALLBACK := 1$/KSU_VERSION_FALLBACK := ${KSU_VERSION}/" Kbuild

        KSU_GIT_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.1")"
        sed -i "s/^KSU_VERSION_TAG_FALLBACK := v0.0.1$/KSU_VERSION_TAG_FALLBACK := ${KSU_GIT_TAG}/" Kbuild

        echo "KSU_GIT_TAG: $KSU_GIT_TAG"
        echo "KSU_VERSION: $KSU_VERSION"
        echo "KSU_COMMIT: $(git rev-parse --short HEAD)"

        cd "$GITHUB_WORKSPACE"
        {
          echo "# KernelSU Configuration"
          echo "CONFIG_KSU=y"
        } >> "$GKI_DEFCONFIG"

    - name: Setup pershoot KSUN with susfs
      if: inputs.susfs == 'true'
      shell: bash
      run: |
        cd "$COMMON"
        curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -s dev-susfs

        cd KernelSU-Next/kernel
        COMMITS_COUNT=$(/usr/bin/git rev-list --count HEAD)
        BASE_VERSION=30000
        KSU_VERSION=$(expr $COMMITS_COUNT + "$BASE_VERSION")
        sed -i "s/^KSU_VERSION_FALLBACK := 1$/KSU_VERSION_FALLBACK := ${KSU_VERSION}/" Kbuild

        KSU_GIT_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.1")"
        sed -i "s/^KSU_VERSION_TAG_FALLBACK := v0.0.1$/KSU_VERSION_TAG_FALLBACK := ${KSU_GIT_TAG}/" Kbuild

        echo "KSU_GIT_TAG: $KSU_GIT_TAG"
        echo "KSU_VERSION: $KSU_VERSION"
        echo "KSU_COMMIT: $(git rev-parse --short HEAD)"

        cd "$GITHUB_WORKSPACE"
        {
          echo "# KernelSU Configuration"
          echo "CONFIG_KSU=y"
        } >> "$GKI_DEFCONFIG"

    - name: Extract KSU Version Info
      id: ksu-version
      shell: bash
      run: |
        cd "$COMMON/KernelSU-Next"

        KSU_GIT_VERSION=$(git rev-list --count HEAD 2>/dev/null)
        KSU_GIT_TAG=$(git describe --tags --abbrev=0 2>/dev/null)
        KSU_COMMIT=$(git rev-parse --short HEAD 2>/dev/null)
        KSU_VERSION=$((30000 + KSU_GIT_VERSION))

        echo "KSU_GIT_TAG=$KSU_GIT_TAG" >> "$GITHUB_ENV"
        echo "KSU_VERSION=$KSU_VERSION" >> "$GITHUB_ENV"
        echo "KSU_COMMIT=$KSU_COMMIT" >> "$GITHUB_ENV"

        echo "KSU_GIT_TAG: $KSU_GIT_TAG"
        echo "KSU_VERSION: $KSU_VERSION"
        echo "KSU_COMMIT: $KSU_COMMIT"

    - name: Fix KernelSU-Next
      shell: bash
      run: |
        set -euo pipefail
        cd "$COMMON/KernelSU-Next"
        cp "${{ github.action_path }}/patches/static.patch" ./
        patch -p1 < static.patch

    - name: Patch SELinux access dirty bits
      shell: bash
      run: |
        set -euo pipefail
        cd "$COMMON/KernelSU-Next"

        python3 - <<'PY'
        from pathlib import Path

        p = Path("kernel/feature/selinux_hide.c")
        s = p.read_text()

        if "KSU_FORCE_SELINUX_HIDE_WITH_SUSFS" not in s:
            if "#ifndef CONFIG_KSU_SUSFS" not in s:
                raise SystemExit("ERROR: CONFIG_KSU_SUSFS guard not found in selinux_hide.c")

            if "#endif // #ifndef CONFIG_KSU_SUSFS" not in s:
                raise SystemExit("ERROR: CONFIG_KSU_SUSFS endif not found in selinux_hide.c")

            s = s.replace(
                "#ifndef CONFIG_KSU_SUSFS",
                "#if 1 /* KSU_FORCE_SELINUX_HIDE_WITH_SUSFS */",
                1
            )

            s = s.replace(
                "#endif // #ifndef CONFIG_KSU_SUSFS",
                "#endif // KSU_FORCE_SELINUX_HIDE_WITH_SUSFS",
                1
            )

        marker = "KSU extra sanitize for app-visible /sys/fs/selinux/access"

        sanitize = '''        /* KSU extra sanitize for app-visible /sys/fs/selinux/access
         * Device confirmed indexes:
         * class 2 = process,    perm 26 = execmem   -> 0x02000000
         * class 4 = capability, perm 22 = sys_admin -> 0x00200000
         *
         * This only sanitizes the app-visible /sys/fs/selinux/access result.
         * It does NOT remove real SELinux rules and does NOT touch interception mode.
         */
        if (tclass == 2) {
            avd.allowed &= ~0x02000000;
            avd.auditallow &= ~0x02000000;
        } else if (tclass == 4) {
            avd.allowed &= ~0x00200000;
            avd.auditallow &= ~0x00200000;
        }

        '''

        needle = 'length = scnprintf(buf, SIMPLE_TRANSACTION_LIMIT, "%x %x %x %x %u %x",'

        if marker in s:
            print("SELinux dirty bits patch already applied")
        else:
            idx = s.find(needle)
            if idx == -1:
                raise SystemExit("ERROR: target scnprintf line not found in selinux_hide.c")

            line_start = s.rfind("\n", 0, idx) + 1
            s = s[:line_start] + sanitize + s[line_start:]
            print("SELinux dirty bits patch applied")

        p.write_text(s)
        PY

        echo "=== KSU SELINUX DIRTY BITS PATCH CHECK ==="
        grep -n "KSU_FORCE_SELINUX_HIDE_WITH_SUSFS" kernel/feature/selinux_hide.c
        grep -n "KSU extra sanitize for app-visible /sys/fs/selinux/access" kernel/feature/selinux_hide.c
        grep -n "0x02000000" kernel/feature/selinux_hide.c
        grep -n "0x00200000" kernel/feature/selinux_hide.c
        grep -n "avd.allowed &= ~0x02000000" kernel/feature/selinux_hide.c
        grep -n "avd.allowed &= ~0x00200000" kernel/feature/selinux_hide.c
        grep -nE "scnprintf|access_write|my_write_access|CONFIG_KSU_SUSFS|#if 1" kernel/feature/selinux_hide.c | head -120

        echo "=== KSU INTERCEPTION / HYBRID CHECK ==="
        grep -R -nE "HYBRID|hybrid|KPROBE|MANUAL_HOOK|CONFIG_KSU|ksu_handle" kernel Kconfig 2>/dev/null | head -120 || true
